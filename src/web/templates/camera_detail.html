{% extends "base.html" %}
{% block content %}

<div class="camera-detail">

    <div class="detail-header">
        <h1>Camera {{ cam_id }}</h1>

        <div class="camera-actions">
            <a href="/">← Dashboard</a>
            <a href="/records/{{ cam_id }}">Records</a>
            <a href="/snapshots/{{ cam_id }}">Snapshots</a>
        </div>
    </div>

    <div class="detail-card">

        <img 
            src="{{ url_for('video', cam_id=cam_id) }}" 
            class="detail-stream">

        <div style="margin-top: 10px;">
            {% if presence %}
                <span class="badge active">Presence detected</span>
            {% else %}
                <span class="badge idle">Idle</span>
            {% endif %}
        </div>

    </div>

</div>

{% endblock %}
