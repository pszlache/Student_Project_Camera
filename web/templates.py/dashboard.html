{% extends "base.html" %}

{% block content %}
<h3>Camera Dashboard</h3>

<div style="display:flex;">
    {% for cam_id in cameras %}
        <div style="margin-right:20px;">
            <h4>Camera {{ cam_id }}</h4>
            <img src="/video/{{ cam_id }}">
        </div>
    {% endfor %}
</div>

{% if session.get("role") == "admin" %}
<hr>
<a href="{{ url_for('admin_panel') }}">Admin Panel</a>
{% endif %}

{% endblock %}
