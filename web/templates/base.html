<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ title or "Presence Monitor" }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="app">

    <aside class="sidebar">
        <div class="logo">Presence Monitor</div>

        <nav>
            <a href="/">Dashboard</a>
            <a href="/events">Events</a>
            <a href="/system">System</a>

            {% if session.get("user") and session["user"]["role"] == "admin" %}
            <div class="nav-section">Admin</div>
            <a href="/admin">Admin panel</a>
            {% endif %}
        </nav>
    </aside>

    <div class="main">

        <header class="topbar">

            <div class="status">
                <div class="status-item">
                    <span id="dot-ai" class="dot"></span>
                    <span id="label-ai">AI</span>
                </div>

                <div class="status-item">
                    <span id="dot-gsm" class="dot"></span>
                    <span id="label-gsm">GSM</span>
                </div>

                <div class="status-item">
                    <span id="dot-cameras" class="dot"></span>
                    <span id="label-cameras">Cameras</span>
                </div>
            </div>

            <div class="user">
                {{ session["user"]["email"] }}
                <a href="/logout">Logout</a>
            </div>

        </header>

        <main class="content">
            {% block content %}{% endblock %}
        </main>

    </div>

</div>

<script src="{{ url_for('static', filename='js/main.js') }}"></script>

</body>
</html>
