{% extends "base.html" %}
{% block content %}

<h1>Dashboard</h1>

<div class="tile-grid">

    {% for cam in cameras %}
    <div class="tile"
         onclick="window.location='/camera/{{ cam.id }}'">

        <div class="tile-header">
            <h3>Camera {{ cam.id }}</h3>

            {% if cam.presence %}
                <span class="badge active">Presence</span>
            {% else %}
                <span class="badge idle">Idle</span>
            {% endif %}
        </div>

        <div class="tile-stream">
            <img src="{{ url_for('video', cam_id=cam.id) }}">
        </div>

        <div class="tile-footer">
            <a href="/records/{{ cam.id }}"
               class="secondary-btn"
               onclick="event.stopPropagation();">
                Records
            </a>
        </div>

    </div>
    {% endfor %}

</div>

{% endblock %}
