[project]
name = "student-camera-monitoring"
version = "0.1.0"
description = "Camera monitoring system with motion detection and AI"
authors = [{ name = "Student Project" }]
requires-python = ">=3.9"

dependencies = [
    "flask==3.1.2",
    "numpy==2.4.2",
    "opencv-python==4.13.0.92",
    "pyserial==3.5",
    "bcrypt==5.0.0",
    "psutil==6.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.2",
    "ruff",
    "black",
    "isort"
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 88

[tool.isort]
profile = "black"

[tool.ruff]
line-length = 88